services:
  debian-xfce-vnc:
    image: consol/debian-xfce-vnc:v2.0.3
    container_name: debian-xfce-vnc
    user: "0"
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /dockerstartup/custom
        /dockerstartup/custom/container-init.sh && exec /dockerstartup/vnc_startup.sh "$$@"
      - --
    ports:
      - "${VNC_PORT:-5901}:5901"
      - "${NOVNC_PORT:-6901}:6901"
      - "${SSH_PORT:-2222}:22"
      - "${OPENCODE_PORT:-4096}:4096"    # opencode WebUI 端口
      - "9980-9990:9980-9990"            # 后期特殊用途保留端口
    environment:
      - TZ=${TZ:-Asia/Seoul}
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1280x1024}
      - VNC_PW=${VNC_PW:-1234}

    volumes:
      - ./config/container-init.sh:/dockerstartup/custom/container-init.sh:ro
      - ./config:/headless/Desktop/config          # 将配置文件和环境脚本独立挂载
      - /DATA/AppData/workspace_datahub:/headless/Desktop/workspace    # 将专用的 workspace 目录挂载到桌面，实现管理文件与源码隔离
    restart: unless-stopped
    networks:
      - devnet                             # 加入自定义网络 devnet，便于与其他容器互通

networks:
  devnet:
    driver: bridge
