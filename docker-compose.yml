services:
  debian-xfce-vnc:
    image: consol/debian-xfce-vnc:v2.0.3
    container_name: debian-xfce-vnc
    user: "0"
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /dockerstartup/custom
        /dockerstartup/custom/init.sh && exec /dockerstartup/vnc_startup.sh "$$@"
      - --
    ports:
      - "5901:5901"
      - "6901:6901"
      - "2222:22"
      - "4096:4096"    # opencode WebUI 端口
    environment:
      - TZ=Asia/Seoul
      - VNC_RESOLUTION=1280x720
      - VNC_PW=1234
    volumes:
      - ./init.sh:/dockerstartup/custom/init.sh:ro
      - ./workspace:/headless/Desktop/workspace    # 将专用的 workspace 目录挂载到桌面，实现管理文件与源码隔离
    restart: unless-stopped