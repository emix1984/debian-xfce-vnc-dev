services:
  debian-xfce-vnc-dev:
    image: consol/debian-xfce-vnc:v2.0.3
    container_name: debian-xfce-vnc-dev
    user: "0"
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /dockerstartup/custom
        /dockerstartup/custom/container-init.sh && exec /dockerstartup/vnc_startup.sh "$$@"
      - --
    ports:
      # 开发模式下固定映射端口，不依赖任何外部环境变量和脚本注入
      - "5901:5901"       # VNC 桌面端
      - "6901:6901"       # noVNC 网页端
      - "2222:22"         # SSH 连接
      - "4096:4096"       # OpenCode WebUI
    
    # 也可以取消注释下面这两行，让 Compose 自动将 .deploy_config 当做环境配置读入容器
    # env_file:
    #   - .deploy_config

    environment:
      # 在 dev 模式下，直接在此处硬编码修改开发所需的环境变量，直观且便于随时调整
      - TZ=Asia/Seoul
      - VNC_RESOLUTION=1280x1024
      - VNC_PW=1234
      - OLLAMA_HOST=http://100.102.149.107:11434
    volumes:
      - ./config/container-init.sh:/dockerstartup/custom/container-init.sh:ro
      - ./config:/headless/Desktop/config          # 将配置文件和环境脚本独立挂载
      - ./workspace:/headless/Desktop/workspace    # 将专用的 workspace 目录挂载到桌面
    # 开发模式下遇到错误退出时不自动重启，方便使用 docker logs 查看崩溃现场
    restart: "no"
